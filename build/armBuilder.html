<script>
/* ==================================================================
   06-ui.js —— 界面骨架：折叠面板 / 勾选下拉 / 旋转角度表 / 分隔条

   为什么单独一个模块：
     01~03 是"算"的（运动学 / 任务域 / 底盘尺寸），04~05 是配置层。
     这里是纯粹的"摆界面"，改版时基本只动这个文件，不碰算法。

   对外只暴露两个函数给其它模块用：
     renderAngles()   重画"旋转角度"表（updateAll / 拖动关节时调）
     syncVisMenu()    把 SHOWBOX / SHOW_FRAMES 的状态回填到勾选下拉
   ==================================================================================== */
'use strict';

/* ---------------- 可折叠分区 ----------------
   三个分区（模型链 / 旋转角度 / 可达域）各自有 .sect-hd + .sect-bd。
   状态存 localStorage：这是纯界面偏好，不属于模型。 */
const SECTS = ['List', 'Q', 'Veh', 'Data'];
let SECT_OPEN = { List: true, Q: true, Veh: true, Data: true };
/* 旋转角度是唯一"给足高度"的块：它的滑条要能一次看全、方便反复拖。
   其余几块都是长内容，各占一点就行 —— 想细看就折叠别的、把它撑开。 */
const SECT_ROOMY = { Q: 340 };

function setSectOpen(key, open, save) {
  SECT_OPEN[key] = !!open;
  const hd = document.getElementById('hd' + key);
  const bd = document.getElementById('bd' + key);
  if (hd) hd.classList.toggle('collapsed', !open);
  if (bd) {
    bd.classList.toggle('hidden', !open);
    /* 旋转角度是唯一"按内容给高度"的块：展开时把它放开，
       这样它的滑条能一次看全（其余几块是长内容，靠滚动）。 */
    if (SECT_ROOMY[key]) bd.style.maxHeight = open ? SECT_ROOMY[key] + 'px' : '';
  }
  syncSplitHandles();
  if (save !== false) saveSectPrefs();
}
function saveSectPrefs() {
  try { localStorage.setItem('armBuilderSect', JSON.stringify(SECT_OPEN)); } catch (e) {}
}
function loadSectPrefs() {
  try {
    const s = localStorage.getItem('armBuilderSect');
    if (s) { const o = JSON.parse(s); SECTS.forEach(k => { if (typeof o[k] === 'boolean') SECT_OPEN[k] = o[k]; }); }
  } catch (e) {}
  SECTS.forEach(k => setSectOpen(k, SECT_OPEN[k], false));
}
function initCollapse() {
  SECTS.forEach(k => {
    const hd = document.getElementById('hd' + k);
    if (!hd) return;
    hd.addEventListener('click', e => {
      /* 点标题里的按钮（比如 ＋建立坐标系）不该折叠 */
      if (e.target.closest('button')) return;
      setSectOpen(k, !SECT_OPEN[k]);
    });
  });
  loadSectPrefs();
}

/* ---------------- 分隔条 ----------------
   只有【同时展开】的两个分区之间那条才有用。
   #split  在 模型链 / 旋转角度 之间
   #split2 在 旋转角度 / 可达域 之间
   拖动改的是上下两块的 flex 比例（不写死 px），窗口改高时比例自动跟着走。 */
let SPLIT_PCT = null;
const SPLIT_DEF = .5;
function setSplitPct(p) {
  p = Math.max(.16, Math.min(.84, p));
  const a = document.getElementById('bdList'), b = document.getElementById('bdData');
  if (a) a.style.flex = '1 1 ' + (p * 100).toFixed(2) + '%';
  if (b) b.style.flex = '1 1 ' + ((1 - p) * 100).toFixed(2) + '%';
  SPLIT_PCT = p;
}function applySplit() { setSplitPct(SPLIT_PCT == null ? SPLIT_DEF : SPLIT_PCT); }
function syncSplitHandles() {
  const o = k => SECT_OPEN[k];
  const show = (id, on) => { const el = document.getElementById(id); if (el) el.style.display = on ? '' : 'none'; };
  /* 一条分隔条在它上下相邻的"两块里至少有一块展开"时才有意义 */
  show('split',  o('List') && (o('Q') || o('Veh') || o('Data')));
  show('split2', (o('List') || o('Q')) && (o('Veh') || o('Data')));
  show('split3', (o('List') || o('Q') || o('Veh')) && o('Data'));
}function initSplit() {
  const sp = document.getElementById('split');
  if (!sp) return;
  const a = document.getElementById('bdList'), b = document.getElementById('bdData');
  let drag = null;
  sp.addEventListener('mousedown', e => {
    if (!a || !b) return;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    drag = { y: e.clientY, h: ra.height, tot: ra.height + rb.height };
    sp.classList.add('on'); document.body.style.cursor = 'ns-resize';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    setSplitPct((drag.h + (e.clientY - drag.y)) / Math.max(1, drag.tot));
  });
  window.addEventListener('mouseup', () => {
    if (!drag) return;
    drag = null; sp.classList.remove('on'); document.body.style.cursor = '';
    saveLocal();
  });
  sp.addEventListener('dblclick', () => { SPLIT_PCT = SPLIT_DEF; applySplit(); saveLocal(); });
  applySplit();
}

/* ---------------- 勾选下拉（坐标架 / 底盘框 / 长宽高框 / 限制球）----------------
   把原来顶栏那四个独立勾选框收进一个菜单，省地方。
   底下的 DOM 元素（cbFrames/cbChassis/cbLWH/cbBall）保持不变 ——
   03 模块里那套 SHOWBOX 联动逻辑一行都不用改。 */
function syncVisMenu() {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.checked = !!v; };
  set('cbFrames', SHOW_FRAMES);
  set('cbChassis', SHOWBOX.chassis !== false);
  set('cbLWH', SHOWBOX.lwh !== false);
  set('cbBall', SHOWBOX.ball !== false);
}
function initVisMenu() {
  const btn = document.getElementById('btnVis');
  const pop = document.getElementById('visMenu');
  if (!btn || !pop) return;
  /* 菜单贴到按钮正下方 */
  const place = () => {
    const r = btn.getBoundingClientRect();
    pop.style.left = Math.round(r.left) + 'px';
    pop.style.top = Math.round(r.bottom + 4) + 'px';
  };
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (pop.classList.contains('on')) { pop.classList.remove('on'); return; }
    place(); pop.classList.add('on');
  });
  /* 点别处 / 滚动就收起来 */
  document.addEventListener('click', e => {
    if (!pop.contains(e.target) && e.target !== btn) pop.classList.remove('on');
  });
  window.addEventListener('resize', () => { if (pop.classList.contains('on')) place(); });
  window.addEventListener('scroll', () => pop.classList.remove('on'), true);
  syncVisMenu();
}

/* ---------------- 旋转角度：每个关节一条滑条 ----------------
   用户要的是"能手动拉条看不同角度下的情况"，不只是看数字。
   所以这里每个关节一行：
       [关节名 轴向]  [滑条（范围=该关节限位）]  [数字框]  [↺]
   拖动 => 改 Q[i] => 重算正解 + 可达集 + 数据面板，三维视图跟着动。
   范围就是该关节的限位；不限位的关节给 ±180°。

   性能：滑条 input 事件很密，所以用 rAF 合并 —— 一帧最多算一次，
   拖动不会把主线程堵死。 */
let Q_RAF = null;
/* ---------------- 关节角度的"网格" ----------------
   滑条只能取 min + k·step 这类网格上的值，而"我们算出来的网格点"和
   "浏览器自己吸附出来的网格点"一旦差一格，就会出现
   "引擎里 77、滑条上 76.9"这种两边对不上的状态（踩过）。
   ★ 所以网格【由我们自己定】，并且只此一处：
       步长 = 1°（度数上最自然，也和数字框的 step=1 一致）
       网格点 = lo 起、每 1° 一个，最后补上 hi
     写 value 之前先吸附到它；拖回来的值也吸附到它。
   这样引擎、滑条、数字框、读数永远是同一个数。 */
function angleGrid(lo, hi){
  const step = 1;
  const n = Math.max(0, Math.ceil((hi - lo) / step - 1e-9));
  return { lo: lo, hi: hi, step: step, n: n };
}
function snapToGrid(v, g){
  if (!g) return +v || 0;
  if (!(v >= g.lo)) v = g.lo;                     // NaN 也走这条
  if (v > g.hi) v = g.hi;
  return Math.min(g.hi, Math.round(g.lo + Math.round((v - g.lo) / g.step) * g.step));
}
/* 第 i 个关节的网格（找不到面板元素时按限位现算一个） */
function jointGrid(i, lo, hi){
  const el = document.getElementById('qsl' + i);
  if (el) {
    const step = +el.step;
    if (isFinite(step) && step > 0) {
      return { lo: +el.min, hi: +el.max, step: step,
               n: Math.max(0, Math.ceil((+el.max - +el.min) / step - 1e-9)) };
    }
  }
  return angleGrid(lo, hi);
}
function onChangeJoint(i, v) {
  /* ★ 以"网格上的那个点"为准：传进来的值先吸附到网格，再写回控件与引擎。
     不这么做的话，控件会按自己的规则再吸附一次，两边就差一格。 */
  const lim = (typeof qLimits === 'function') ? qLimits()[i] : null;
  let val = +v;
  if (lim) val = snapToGrid(val, jointGrid(i, lim[0], lim[1]));
  Q[i] = val;
  const num = document.getElementById('qnum' + i);
  if (num && +num.value !== val) num.value = val.toFixed(1);
  const sl0 = document.getElementById('qsl' + i);
  if (sl0 && +sl0.value !== val) sl0.value = val;
  if (Q_RAF) return;
  Q_RAF = requestAnimationFrame(() => {
    Q_RAF = null;
    refreshAfterJoint();
  });
}
function refreshAfterJoint() {
  if (typeof CURVEPTS !== 'undefined') CURVEPTS = fkAll(Q);
  if (typeof draw3D === 'function') draw3D();
  if (typeof analyzeTask === 'function') analyzeTask();
  if (typeof syncQReadout === 'function') syncQReadout();
  if (typeof saveLocal === 'function') saveLocal();
}

/* 只更新表里的数字，不重建 DOM —— 拖动时不能把正在拖的元素换掉 */
function syncQReadout() {
  const nA = (typeof armCount === 'function') ? armCount() : 1;
  let flat = 0;
  for (let a = 0; a < nA; a++) {
    const A = (typeof ARMS !== 'undefined' && ARMS[a]) ? ARMS[a] : null;
    if (!A) continue;
    for (let ci = A.c0; ci < A.cN; ci++) {
      if (!CHAIN[ci].movable) continue;
      const el = document.getElementById('qv' + flat);
      if (el) el.textContent = (Q[flat] === undefined ? '-' : (+Q[flat]).toFixed(1)) + '°';
      flat++;
    }
  }
}

function renderAngles() {
  const box = document.getElementById('qbody');
  if (!box) return;
  if (!CHAIN || !CHAIN.length) {
    box.innerHTML = '<div style="color:#5d6b88;padding:4px 0">还没有模型</div>';
    return;
  }
  const nA = (typeof armCount === 'function') ? armCount() : 1;
  const rows = [];
  let flat = 0;
  for (let a = 0; a < nA; a++) {
    const A = (typeof ARMS !== 'undefined' && ARMS[a]) ? ARMS[a] : null;
    if (!A) continue;
    if (nA > 1) {
      rows.push('<div class="qarm">' + (A.name || ('臂' + a)) + '</div>');
    }
    for (let ci = A.c0; ci < A.cN; ci++) {
      const c = CHAIN[ci];
      if (!c.movable) continue;
      const i = flat;
      const lo = c.limits ? Math.min(c.limits[0], c.limits[1]) : -180;
      const hi = c.limits ? Math.max(c.limits[0], c.limits[1]) : 180;
      /* ★ 步长固定 1°（与数字框的 step=1 一致）。
         原来用 (hi−lo)/200（joint1 = 0.61°、joint2 = 1.45°），网格是"歪"的：
         写一个不在网格上的 value 会被浏览器自己吸附，和引擎里的值差一格。
         1° 这个网格是自洽的，且 200 个刻度在 150px 宽的条上够用。 */
      const grid = angleGrid(lo, hi);
      const stepv = grid.step;
      const val = snapToGrid((Q[i] === undefined) ? 0 : Q[i], grid);
      const limTxt = c.limits ? (lo + ' ~ ' + hi + '°') : '不限（±180°）';
      rows.push(
        '<div class="qrow" title="限位 ' + limTxt + '">' +
          '<div class="qhd"><span class="qnm">' + c.joint +
            '</span><span class="qax">' + (c.axLabel || '') + '</span>' +
            '<span class="qv" id="qv' + i + '">' + val.toFixed(1) + '°</span></div>' +
          '<div class="qs"><input type="range" id="qsl' + i + '" min="' + lo + '" max="' + hi +
            '" step="' + stepv + '" value="' + val + '" title="限位 ' + limTxt + '">' +
            '<input type="number" id="qnum' + i + '" min="' + lo + '" max="' + hi +
            '" step="1" value="' + val.toFixed(1) + '" title="直接输入角度">' +
            '<button class="qrs" data-qrs="' + i + '" title="回到零位">↺</button></div>' +
        '</div>');
      flat++;
    }
  }
  if (!flat) { box.innerHTML = '<div style="color:#5d6b88;padding:4px 0">这条链没有可动关节</div>'; return; }
  box.innerHTML = rows.join('');
  wireAngleControls();
}
function wireAngleControls() {
  const box = document.getElementById('qbody');
  if (!box || box.dataset.wired === '1') { /* 每次重建都要重接 */ }
  box.querySelectorAll('input[type=range]').forEach(el => {
    el.addEventListener('input', () => onChangeJoint(+el.id.slice(3), +el.value));
  });
  box.querySelectorAll('input[type=number]').forEach(el => {
    el.addEventListener('change', () => onChangeJoint(+el.id.slice(4), +el.value || 0));
  });
  box.querySelectorAll('[data-qrs]').forEach(el => {
    el.addEventListener('click', () => onChangeJoint(+el.dataset.qrs, 0));
  });
}

/* ---------------- 全部关节归零 ----------------
   对应原来「🎛 关节」面板里的"重置" */
function resetAllJoints() {
  for (let i = 0; i < NJ; i++) Q[i] = 0;
  const lim = qLimits();
  for (let i = 0; i < NJ; i++) Q[i] = Math.min(Math.max(0, lim[i][0]), lim[i][1]);
  renderAngles();
  refreshAfterJoint();
}

/* ---------------- 装配位置 / 夹爪轴（进 JSON） ----------------
   这两项不是几何，但换了就必须一起说清楚，否则同一份臂型的结论会变。
   所以作为 MODEL.vehicle 存进模型 JSON，随「保存 JSON / 读取文件」一起走。

   向后兼容：老 JSON 没有 vehicle 字段时，从 RULES.init 兜一个默认值，
   并在第一次保存时补上。 */
const AXIS6 = ['+X', '-X', '+Y', '-Y', '+Z', '-Z'];

function vehicleOf(m) {
  const mm = m || MODEL;
  if (mm && mm.vehicle) return mm.vehicle;
  /* 兜底：从规则侧的装配位初始化（存在但没写进模型） */
  const init = (typeof RULES !== 'undefined' && RULES && RULES.init) ? RULES.init : null;
  return {
    asm: init ? { x: init.x, y: init.y, z: init.z } : { x: 0, y: 0, z: 0 },
    insertAxis: (RULES && RULES.act && RULES.act.insertAxis) || 'y',
    gripAxis: (RULES && RULES.act && RULES.act.gripAxis) || 'x'
  };
}
function setVehicle(patch) {
  if (!MODEL) return;
  const v = vehicleOf();
  MODEL.vehicle = v;
  if (patch && patch.asm) v.asm = patch.asm;
  if (patch && patch.insertAxis) v.insertAxis = patch.insertAxis;
  if (patch && patch.gripAxis) v.gripAxis = patch.gripAxis;
  /* 同步给规则侧（任务域换算要用装配位） */
  if (typeof RULES !== 'undefined' && RULES && RULES.init && v.asm) {
    RULES.init.x = +v.asm.x || 0; RULES.init.y = +v.asm.y || 0; RULES.init.z = +v.asm.z || 0;
  }
  if (typeof RULES !== 'undefined' && RULES && RULES.act) {
    RULES.act.insertAxis = v.insertAxis;
    RULES.act.gripAxis = v.gripAxis;
  }
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
  if (v.asm) { set('inCx', v.asm.x); set('inCy', v.asm.y); set('inCz', v.asm.z); }
}

function renderVehicle() {
  const box = document.getElementById('vehBody');
  if (!box) return;
  if (!MODEL) { box.innerHTML = '<div style="color:#5d6b88">还没有模型</div>'; return; }
  const v = vehicleOf();
  MODEL.vehicle = v;                      // 认下来，保存时就会带上
  const num = (id, val, stepv) =>
    '<input type="number" id="' + id + '" step="' + stepv + '" value="' + (val || 0) +
    '" style="width:62px">';
  box.innerHTML =
    '<div class="vehrow"><span class="k1">装配臂位置</span>' +
      num('vhX', v.asm.x, 10) + num('vhY', v.asm.y, 10) + num('vhZ', v.asm.z, 10) +
      '<span class="u">mm（世界系 OXYZ）</span></div>' +
    '<div class="vehrow"><span class="k1">夹爪插入轴</span>' +
      '<select id="vhIns">' + AXIS6.map(a =>
        '<option ' + (v.insertAxis === a.toLowerCase().replace('+', '') ? 'selected' : '') +
        '>' + a + '</option>').join('') + '</select>' +
      '<span class="k1" style="margin-left:10px">夹紧轴</span>' +
      '<select id="vhGrip">' + ['x', 'y', 'z'].map(a =>
        '<option ' + (v.gripAxis === a ? 'selected' : '') + '>' + a.toUpperCase() + '</option>').join('') +
      '</select></div>' +
    '<div class="vehnote">这两项随「保存 JSON」一起存，读取时自动带回来</div>';
  wireVehicle();
}
function wireVehicle() {
  const g = id => document.getElementById(id);
  const push = () => setVehicle({ asm: {
    x: +g('vhX').value || 0, y: +g('vhY').value || 0, z: +g('vhZ').value || 0 } });
  ['vhX', 'vhY', 'vhZ'].forEach(id => { const el = g(id); if (el) el.onchange = push; });
  if (g('vhIns')) g('vhIns').onchange = e =>
    setVehicle({ insertAxis: e.target.value.toLowerCase().replace('+', '') });
  if (g('vhGrip')) g('vhGrip').onchange = e =>
    setVehicle({ gripAxis: e.target.value.toLowerCase() });
}
function initVehicle() {
  const b = document.getElementById('btnQReset');
  if (b) b.onclick = e => { e.stopPropagation(); resetAllJoints(); };
}

/* ---------------- 「已保存」提示 ----------------
   每次 saveLocal() 都会调这里。为什么要有它：用户问过"到底有没有实时保存" ——
   看不见的机制等于不存在（这次报的第二个问题就是这么来的）。
   行为：
     · 第一次（载入存档时）只把状态写出来，不闪
     · 之后每次改动闪一下并显示时间
   元素是懒创建的，模板里不用留位置；样式在 .chip 那条规则旁边。 */
let SAVED_HIDE = null;
function markSaved(quiet) {
  const t = document.getElementById('tools');
  if (!t) return;
  let el = document.getElementById('savedChip');
  if (!el) {
    el = document.createElement('span');
    el.id = 'savedChip'; el.className = 'chip';
    el.title = '模型、关节角与设置都存在浏览器本地；刷新/重开还在。' +
               '换构型时各存各的，互不覆盖。「保存 JSON」是另存成文件。';
    t.insertBefore(el, t.firstChild);
  }
  const d = new Date();
  const hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) +
             ':' + ('0' + d.getSeconds()).slice(-2);
  el.textContent = '🕒 已保存 ' + hm;
  if (quiet) return;
  el.classList.add('flash');
  if (SAVED_HIDE) clearTimeout(SAVED_HIDE);
  SAVED_HIDE = setTimeout(() => el.classList.remove('flash'), 700);
}

/* ---------------- 接线 ---------------- */
initCollapse();
initSplit();
initVisMenu();
initVehicle();

</script>

<script>
/* ==================================================================
   07-wizard.js —— 新建向导

   「新建」按钮的流程（按用户规范）：
     ① 单臂 / 双臂
     ② base_yaw（双臂时每条臂各一个）
     ③ 依次搭建每个 joint 与 link
     ④ 装配臂相对世界坐标系原点的 xyz
     ⑤ 夹爪往哪个轴插入（可选）

   设计取舍：
   · 向导只产出【一份新的 MODEL/ARMS】，不改引擎。所以它本质是个"表单 -> 数据"的转换器。
   · 每一步先校验再放行：② 要有 yaw；③ 至少要有一段。
   · 第 ④ 步写进"装配臂位置"（任务域侧，cfg.init / 顶栏那三个输入框）；
     第 ⑤ 步写进 CONFIG 的夹爪轴约定（RULES.act.insertAxis / gripAxis）。
     两者都不是几何量，所以不进 links。

   ★ 为什么装配位置与夹爪轴放在这里问：
     规则手册的位姿范围是相对世界坐标系(OXYZ)的，而臂装在车上；
     不知道装在哪、往哪个轴插，任务域校核就没法做。
==================================================================================== */
'use strict';

/* ---------------- 草稿 ---------------- */
const WIZ = {
  on: false, step: 0,
  nArm: 1,                       // 1 或 2
  arms: [],                      // [{name, yaw, links:[{...}]}]
  asm: { x: -500, y: -200, z: 800 },   // 装配臂位置（世界系 mm）
  insertAxis: 'y',               // 夹爪往哪个轴插入
  gripAxis: 'x'                  // 夹爪自身沿哪个轴夹紧
};

const WIZ_STEPS = ['臂数', '安装基准', '关节与连杆', '装配位置', '夹爪轴'];
const AXIS_OPTS = ['+X', '-X', '+Y', '-Y', '+Z', '-Z'];
const ID_AXES = { x: '+X', y: '+Y', z: '+Z' };

function wizDefaultLinks(n) {
  const out = [];
  for (let i = 1; i <= n; i++) {
    out.push({ name: 'link' + i, joint: 'joint' + i,
               pos: [0, 0, i === 1 ? 100 : 150], axis: '+X',
               axes: { x: '+X', y: '+Y', z: '+Z' },      // 新坐标系三轴对齐父系的哪个轴
               rot: [], limits: [-90, 90], movable: true });
  }
  return out;
}
function wizReset() {
  WIZ.step = 0;
  WIZ.nArm = 1;
  WIZ.arms = [{ name: '臂1', yaw: -90, asm: { x: 0, y: 0, z: 0 },
                links: wizDefaultLinks(3) }];
  WIZ.asm = { x: -500, y: -200, z: 800 };
  WIZ.insertAxis = 'y';
  WIZ.gripAxis = 'x';
}
function wizEnsureArms() {
  while (WIZ.arms.length < WIZ.nArm) {
    /* 第二条臂默认放到车的另一侧 —— 这样"分别校核"才有意义 */
    const k = WIZ.arms.length;
    WIZ.arms.push({ name: '臂' + (k + 1), yaw: -90,
                    asm: { x: 0, y: k === 1 ? -360 : 0, z: 0 },
                    links: wizDefaultLinks(3) });
  }
  WIZ.arms.length = WIZ.nArm;
}

/* ---------------- 草稿 -> 臂模型 ---------------- */
function wizBuildArm(a) {
  const links = [{
    name: 'base_link', joint: 'base_joint', type: 'revolute', posMode: 'origin',
    pos: [0, 0, 0], axes: ID_AXES, axis: '+Z', limits: null
  }];
  a.links.forEach(L => {
    const nm = (L.name || '').trim() || 'link';
    links.push({
      name: nm, joint: (L.joint || '').trim() || (nm + '_j'),
      type: L.movable === false ? 'fixed' : 'revolute', posMode: 'parent',
      pos: [+L.pos[0] || 0, +L.pos[1] || 0, +L.pos[2] || 0],
      /* 新坐标系三轴对齐父系的哪个轴；没填就按 ID（与父系同向） */
      axes: L.axes || ID_AXES,
      axis: L.axis || '+X',
      limits: (L.movable === false || !L.limits) ? null : [+L.limits[0], +L.limits[1]],
      rot: (Array.isArray(L.rot) && L.rot.length) ? L.rot : undefined
    });
  });
  /* 末端：固定在最后一段上的工具（长度后续可在模型链里改） */
  links.push({ name: 'tip', joint: 'tip_fix', type: 'fixed', posMode: 'parent',
               pos: [0, 0, 0], axes: ID_AXES, axis: '+Z', limits: null });
  const arm = { name: a.name || '臂', base: { xyz: [0, 0, 0], yaw: +a.yaw || 0 }, links };
  /* ★ 这条臂自己的装配位（相对世界坐标系原点）。
     任务域校核按它把任务点转到这条臂的 base 系 —— 每条臂各一份。 */
  if (a.asm) arm.asm = { x: +a.asm.x || 0, y: +a.asm.y || 0, z: +a.asm.z || 0 };
  return arm;
}

/* ---------------- 各步的渲染 ---------------- */
function wizStepHTML() {
  const s = WIZ.step;
  if (s === 0) {
    return `<h3>这条链有几条臂？</h3>
      <p class="sub">双臂的两条臂各自有独立的基座与安装朝向，关节数也可以不同。</p>
      <div class="two">
        <div class="pick ${WIZ.nArm === 1 ? 'on' : ''}" data-arm="1">
          <b>单臂</b><span>一条链，最常用</span></div>
        <div class="pick ${WIZ.nArm === 2 ? 'on' : ''}" data-arm="2">
          <b>双臂</b><span>两条链，可各自定位</span></div>
      </div>`;
  }
  if (s === 1) {
    const multi = WIZ.arms.length > 1;
    return `<h3>安装基准</h3>
      <p class="sub">臂装在车上的朝向（绕竖直轴）与位置。${multi
        ? '每条臂各一份 —— 两条臂分别校核的前提就是它们装的地方不一样。'
        : ''}</p>
      ${WIZ.arms.map((a, i) => `
        <div class="segrow">
          <div class="t">${multi ? (a.name || ('臂' + (i + 1))) : '安装朝向与位置'}</div>
          <div class="f" style="grid-template-columns:auto 1fr">
            <label>base_yaw (°)</label>
            <input type="number" step="15" data-yaw="${i}" value="${a.yaw}">
          </div>
          <div class="f" style="grid-template-columns:auto 1fr 1fr 1fr;margin-top:5px">
            <label title="这条臂的基座装在整车上的哪个位置（mm）">基座位置</label>
            <input type="number" step="10" data-asm0="${i}" value="${(a.asm && a.asm.x) || 0}" title="x (mm)">
            <input type="number" step="10" data-asm1="${i}" value="${(a.asm && a.asm.y) || 0}" title="y (mm)">
            <input type="number" step="10" data-asm2="${i}" value="${(a.asm && a.asm.z) || 0}" title="z (mm)">
          </div>
        </div>`).join('')}`;
  }
  if (s === 2) {
    return `<h3>依次搭建 joint 与 link</h3>
      <p class="sub">每行是一段：相对上一坐标系的位置(offset) + 转动轴 + 限位。留空限位=不限。</p>
      ${WIZ.arms.map((a, ai) => `
        <div class="segrow">
          <div class="t" style="display:flex;align-items:center">
            ${a.name || ('臂' + (ai + 1))}
            <button class="del" data-add="${ai}">＋ 加一段</button>
          </div>
          <div id="wlinks${ai}">${a.links.map((L, li) => wizLinkRow(ai, li, L)).join('')}</div>
        </div>`).join('')}`;
  }
  if (s === 3) {
    return `<h3>装配臂相对世界坐标系原点的位置</h3>
      <p class="sub">规则手册的位姿范围定义在战场地面系(OXYZ)下；这里填臂在其中的位置。</p>
      <div class="segrow">
        <div class="f">
          <label>x (mm)</label><input type="number" step="10" id="wAsmX" value="${WIZ.asm.x}">
          <label>y (mm)</label><input type="number" step="10" id="wAsmY" value="${WIZ.asm.y}">
          <label>z (mm)</label><input type="number" step="10" id="wAsmZ" value="${WIZ.asm.z}">
        </div>
      </div>`;
  }
  return `<h3>夹爪往哪个轴插入</h3>
    <p class="sub">插入方向用于姿态约束（IK 复核）；夹紧轴是夹爪自身张开/闭合的方向。</p>
    <div class="segrow">
      <div class="f" style="grid-template-columns:auto 1fr">
        <label>插入轴</label>
        <select id="wIns">${AXIS_OPTS.map(a =>
          `<option value="${a.toLowerCase().replace('+','').replace('-','-')}" ${WIZ.insertAxis === a.toLowerCase().replace('+','').replace('-','-') ? 'selected' : ''}>${a}</option>`).join('')}</select>
        <label>夹紧轴</label>
        <select id="wGrip">${['x', 'y', 'z'].map(a =>
          `<option value="${a}" ${WIZ.gripAxis === a ? 'selected' : ''}>${a.toUpperCase()}</option>`).join('')}</select>
      </div>
    </div>
    <div class="segrow" style="color:#5d6b88;font-size:11px">
      确认后会新建模型，并覆盖当前模型与本地存档。
    </div>`;
}

function wizLinkRow(ai, li, L) {
  const lim = L.limits ? L.limits : ['', ''];
  const ax = L.axes || ID_AXES;
  const axSel = (key, tag) =>
    `<select data-lax="${ai}:${li}:${key}" title="新坐标系的 ${tag} 轴对齐父系的哪个轴">` +
    AXIS_OPTS.map(a => `<option ${ax[key] === a ? 'selected' : ''}>${a}</option>`).join('') +
    `</select>`;
  return `<div class="segrow" style="padding:6px 8px;margin-bottom:6px">
    <div class="f">
      <label>#${li + 1}</label>
      <input type="text" data-ln="${ai}:${li}" value="${L.name || ''}" placeholder="link 名">
      <input type="number" data-lp0="${ai}:${li}" value="${L.pos[0]}" step="10" title="offset x (mm)">
      <input type="number" data-lp1="${ai}:${li}" value="${L.pos[1]}" step="10" title="offset y (mm)">
      <input type="number" data-lp2="${ai}:${li}" value="${L.pos[2]}" step="10" title="offset z (mm)">
      <button class="del" data-del="${ai}:${li}" title="删掉这一段">✕</button>
    </div>
    <div class="f" style="margin-top:5px">
      <label title="新坐标系 X/Y/Z 分别对齐父系的哪个轴">坐标系</label>
      ${axSel('x', 'X')}${axSel('y', 'Y')}${axSel('z', 'Z')}
      <span></span>
    </div>
    <div class="f" style="margin-top:5px">
      <label>转动轴</label>
      <select data-la="${ai}:${li}" title="绕新坐标系自身的哪个轴转动">${AXIS_OPTS.map(a =>
        `<option ${L.axis === a ? 'selected' : ''}>${a}</option>`).join('')}</select>
      <input type="number" data-ll0="${ai}:${li}" value="${lim[0]}" step="5" title="下限 (°)，留空=不限">
      <input type="number" data-ll1="${ai}:${li}" value="${lim[1]}" step="5" title="上限 (°)，留空=不限">
      <span></span>
    </div>
  </div>`;
}

/* ---------------- 表单 -> 草稿（每次切换步骤前收一次） ---------------- */
function wizCollect() {
  const q = sel => document.querySelector(sel);
  document.querySelectorAll('[data-yaw]').forEach(el => {
    const i = +el.dataset.yaw; if (WIZ.arms[i]) WIZ.arms[i].yaw = +el.value || 0;
  });
  /* 每条臂的基座位置 */
  for (const k of ['0', '1', '2']) {
    document.querySelectorAll('[data-asm' + k + ']').forEach(el => {
      const i = +el.dataset['asm' + k];
      if (!WIZ.arms[i]) return;
      if (!WIZ.arms[i].asm) WIZ.arms[i].asm = { x: 0, y: 0, z: 0 };
      WIZ.arms[i].asm[['x', 'y', 'z'][+k]] = +el.value || 0;
    });
  }
  document.querySelectorAll('[data-ln]').forEach(el => {
    const [ai, li] = el.dataset.ln.split(':').map(Number);
    if (WIZ.arms[ai] && WIZ.arms[ai].links[li]) WIZ.arms[ai].links[li].name = el.value;
  });
  for (const k of ['0', '1', '2']) {
    document.querySelectorAll('[data-lp' + k + ']').forEach(el => {
      const [ai, li] = el.dataset['lp' + k].split(':').map(Number);
      if (WIZ.arms[ai] && WIZ.arms[ai].links[li]) WIZ.arms[ai].links[li].pos[k] = +el.value || 0;
    });
  }
  document.querySelectorAll('[data-la]').forEach(el => {
    const [ai, li] = el.dataset.la.split(':').map(Number);
    if (WIZ.arms[ai] && WIZ.arms[ai].links[li]) WIZ.arms[ai].links[li].axis = el.value;
  });
  /* 新坐标系三轴对齐父系的哪个轴（data-lax="臂:段:轴"） */
  document.querySelectorAll('[data-lax]').forEach(el => {
    const [ai, li, key] = el.dataset.lax.split(':');
    const L = WIZ.arms[+ai] && WIZ.arms[+ai].links[+li]; if (!L) return;
    if (!L.axes) L.axes = { x: '+X', y: '+Y', z: '+Z' };
    L.axes[key] = el.value;
  });
  for (const k of ['0', '1']) {
    document.querySelectorAll('[data-ll' + k + ']').forEach(el => {
      const [ai, li] = el.dataset['ll' + k].split(':').map(Number);
      const L = WIZ.arms[ai] && WIZ.arms[ai].links[li]; if (!L) return;
      if (!L.limits) L.limits = [null, null];
      L.limits[k] = (el.value === '') ? null : +el.value;
    });
  }
  const g = id => document.getElementById(id);
  if (g('wAsmX')) WIZ.asm = { x: +g('wAsmX').value || 0, y: +g('wAsmY').value || 0, z: +g('wAsmZ').value || 0 };
  if (g('wIns')) WIZ.insertAxis = g('wIns').value;
  if (g('wGrip')) WIZ.gripAxis = g('wGrip').value;
  /* 收完之后把空限位规整一下：两端都空 ⇒ 不限位 */
  WIZ.arms.forEach(a => a.links.forEach(L => {
    if (L.limits && L.limits[0] === null && L.limits[1] === null) L.limits = null;
  }));
}

/* ---------------- 校验 ---------------- */
function wizValidate(step) {
  if (step === 2) {
    for (let i = 0; i < WIZ.arms.length; i++) {
      const a = WIZ.arms[i];
      const who = a.name || ('臂' + (i + 1));
      if (!a.links.length) return who + ' 至少要有一段';
      for (let j = 0; j < a.links.length; j++) {
        const L = a.links[j];
        const nm = (L.name || '').trim();
        if (!nm) return who + ' 第 ' + (j + 1) + ' 段还没起名字';
        /* 坐标系必须是右手系：三轴不能重复、行列式要为 +1。
           用引擎里的 frameOK() 判，判据只有一份。 */
        if (L.axes && typeof frameOK === 'function') {
          const r = frameOK(L.axes);
          if (r.dup) return who + ' 第 ' + (j + 1) + ' 段：坐标系的三个轴重复了';
          if (Math.abs(r.det - 1) > 1e-9) {
            return who + ' 第 ' + (j + 1) + ' 段：坐标系不是右手系（det=' +
                   r.det.toFixed(0) + '，应为 +1）';
          }
        }
      }
    }
  }
  return '';
}

/* ---------------- 渲染 / 导航 ---------------- */
function wizRender() {
  const S = document.getElementById('wSteps'), B = document.getElementById('wBody');
  if (!S || !B) return;
  S.innerHTML = WIZ_STEPS.map((t, i) =>
    '<span class="' + (i === WIZ.step ? 'on' : (i < WIZ.step ? 'done' : '')) + '">' +
    (i + 1) + '. ' + t + '</span>').join('');
  B.innerHTML = wizStepHTML();
  B.scrollTop = 0;
  const prev = document.getElementById('wPrev'), next = document.getElementById('wNext');
  if (prev) prev.disabled = (WIZ.step === 0);
  if (next) next.textContent = (WIZ.step === WIZ_STEPS.length - 1) ? '完成并新建' : '下一步';
  wizWire();
}
function wizWire() {
  const B = document.getElementById('wBody');
  if (!B) return;
  B.querySelectorAll('.pick').forEach(el => el.onclick = () => {
    WIZ.nArm = +el.dataset.arm; wizEnsureArms(); wizRender();
  });
  B.querySelectorAll('[data-add]').forEach(el => el.onclick = () => {
    wizCollect();
    const ai = +el.dataset.add;
    WIZ.arms[ai].links.push({ name: 'link' + (WIZ.arms[ai].links.length + 1),
      joint: 'joint' + (WIZ.arms[ai].links.length + 1),
      pos: [0, 0, 150], axis: '+X', limits: [-90, 90], movable: true });
    wizRender();
  });
  B.querySelectorAll('[data-del]').forEach(el => el.onclick = () => {
    wizCollect();
    const [ai, li] = el.dataset.del.split(':').map(Number);
    WIZ.arms[ai].links.splice(li, 1);
    if (!WIZ.arms[ai].links.length) WIZ.arms[ai].links = wizDefaultLinks(1);
    wizRender();
  });
}
function wizOpen() {
  wizReset(); WIZ.on = true;
  const w = document.getElementById('wiz');
  if (w) w.classList.add('on');
  document.getElementById('modal').classList.add('hidden');
  wizRender();
}
function wizClose() {
  WIZ.on = false;
  const w = document.getElementById('wiz');
  if (w) w.classList.remove('on');
}
function wizNext() {
  wizCollect();
  const bad = wizValidate(WIZ.step);
  if (bad) { alert(bad); return; }
  if (WIZ.step < WIZ_STEPS.length - 1) { WIZ.step++; wizRender(); return; }
  wizFinish();
}
function wizPrev() { wizCollect(); if (WIZ.step > 0) { WIZ.step--; wizRender(); } }

/* ---------------- 收尾：把草稿变成真正的模型 ---------------- */
function wizFinish() {
  wizCollect();
  const built = WIZ.arms.map(wizBuildArm);
  if (!CONFIG) { alert('还没有配置'); return; }

  /* ★ 向导只产出"臂型"，不产出规则与车体尺寸。
     所以这里把当前配置【复制一份】、只换掉臂，并把 rules / chassis 清成 null ——
     留着上一个构型的规则是错的：拿同济的规则去评一条全新的臂，
     算出来的数字不对应任何东西，而且（改之前）会直接在 analyzeTask 里抛异常。
     规范与尺寸要单独配：在 web/src/configs/ 里写一份 rules / chassis。 */
  const id = CONFIG.id + '_wiz';
  const clone = JSON.parse(JSON.stringify(
    Object.assign({}, CONFIG, { __arms: undefined, model: undefined, arms: undefined })));
  clone.label = (CONFIG.label || CONFIG.id) + ' · 新建';
  clone.model = built[0];
  if (built.length > 1) clone.arms = built; else delete clone.arms;
  clone.rules = null;
  clone.chassis = null;
  defineConfig(id, clone);

  /* 装配位置 / 夹爪轴：没有规则时无处可写，就在 CONFIG 上留一份，
     后续给它加 rules 时可以拿来填。 */
  /* ★ 装配位置与夹爪轴写进【模型】的 vehicle 块（随 JSON 走）。
     之前只挂在配置上，导出/读取时带不走 —— 用户指出后改成进模型。 */
  const veh = { asm: { x: WIZ.asm.x, y: WIZ.asm.y, z: WIZ.asm.z },
                insertAxis: WIZ.insertAxis, gripAxis: WIZ.gripAxis };
  built.forEach(m => { m.vehicle = JSON.parse(JSON.stringify(veh)); });
  clone.asmInit = veh.asm;                 // 保留旧的挂法，兼容已有引用
  clone.gripper = { insertAxis: veh.insertAxis, gripAxis: veh.gripAxis };

  applyConfig(id);

  const set = (id2, v) => { const el = document.getElementById(id2); if (el) el.value = v; };
  set('inCx', WIZ.asm.x); set('inCy', WIZ.asm.y); set('inCz', WIZ.asm.z);

  wizClose();
  updateAll();
  if (typeof renderAngles === 'function') renderAngles();
  if (typeof renderVehicle === 'function') renderVehicle();
  if (typeof initConfigSelector === 'function') initConfigSelector();
  saveLocal();
}

/* ---------------- 接线 ---------------- */
function initWizard() {
  const b = id => document.getElementById(id);
  if (b('mNew'))  b('mNew').onclick  = () => wizOpen();
  if (b('btnNew')) b('btnNew').onclick = () => wizOpen();
  if (b('wNext')) b('wNext').onclick = () => wizNext();
  if (b('wPrev')) b('wPrev').onclick = () => wizPrev();
  if (b('wCancel')) b('wCancel').onclick = () => wizClose();
  const w = b('wiz');
  if (w) w.addEventListener('click', e => { if (e.target === w) wizClose(); });
  window.addEventListener('keydown', e => {
    if (!WIZ.on) return;
    if (e.key === 'Escape') wizClose();
  });
}
initWizard();

</script>

<!-- ==================================================================
     配置层：把「具体是哪条臂 / 哪套规则 / 车体尺寸」从引擎里搬出来放这里。
     引擎只认 CONFIG。加一个新构型 = 在 web/src/configs/ 加一个 .js
     并在 index.txt 里登记一行，不用动引擎。
     ================================================================== -->
<script>
/* ==================================================================
   04-config.js —— 配置层（引擎与"具体哪条臂 / 哪套规则"之间的唯一接口）

   为什么要有这一层：
    这个仓库长期只有一条臂（同济示例臂）。杆长、比赛规则、车体尺寸
    全散在 01/02/03 三个模块里写死，于是：
      · 换一条臂来算，规则还是同济的，算出来的数没有意义
      · 想加新构型只能改引擎 → 很容易把原来那条臂弄坏
    所以把「具体是哪条臂 / 哪套规则」全部搬到配置里，引擎只认 CONFIG。

   一个配置长这样：

     defineConfig('tongji', {
       label:   '同济工程机械臂（示例）',
       model:   { name, base:{xyz,yaw}, links:[...] },     // 臂本身
       rules:   { frame:{...}, levels:{...}, ... } | null,  // 竞赛规则（可缺省）
       chassis: { posMode,pos,size,zDir, lwh, ballD,ballH } | null,  // 车体尺寸
       taskMap: 'auto' | fn                                 // 任务域 <-> base 的换算
     });

   ★ 关键：任务域换算不再手写，而是【从 model.base.yaw 推出来】。
     手写就是 t7 那个 bug 的来源（网页用 base 系、MATLAB 用另一套，差了 90°）。
==================================================================================== */
'use strict';

/* CONFIGS / CONFIG 是本模块自己的；RULES / MAP / MODEL / CHASSIS / SIZER
   的可变声明在 01 与 02 里（它们先加载）。这里【不重复声明】，
   否则同一个 <script> 作用域里 let 重名会直接 SyntaxError。 */
let CONFIG = null;                 // 当前生效的配置
let APPLIED_CONFIG_ID = null;      // 已 apply 的配置 id
const CONFIGS = {};                // id -> 配置
let CONFIG_ORDER = [];
let DEFAULT_CONFIG_ID = 'tongji';  // 默认配置（configs/*.js 可覆盖）

function defineConfig(id, cfg) {
  cfg.id = id;
  CONFIGS[id] = cfg;
  if (!CONFIG_ORDER.includes(id)) CONFIG_ORDER.push(id);
  return cfg;
}
function listConfigs() { return CONFIG_ORDER.slice(); }
function activeConfigId() { return APPLIED_CONFIG_ID; }

/* ---------------- 任务域 <-> base 的换算 ----------------
   这是【唯一】实现，引擎与 MATLAB 都必须用它，不许再各写一份
   （t7 那个"0/200 可解"就是各写一份造成的）。

   frame = { yaw, baseH, taskMap }
     yaw     : 臂本体装车上的朝向（应等于 model.base.yaw）
     baseH   : base 原点离任务系地面的高度 mm
     taskMap : 任务系 → 整车系的轴向约定
               'swap'   : base.X = -OXYZ.X, base.Y = -OXYZ.Y
               'noSwap' : base.X = -OXYZ.Y, base.Y = +OXYZ.X

   两个映射【不是】两个 yaw 角度 —— 它们是两套轴向约定。
   实现上都在 xy 平面内，所以统一写成 Rz(φ) + 抬升，φ 由 taskMap 决定：
     'swap' → φ = 180°     'noSwap' → φ = 90°
   取逆时用 Rz(−φ)。                                          */
const TASKMAP_PHI = { swap: 180, noSwap: 90 };

function mapObj(frame) {
  frame = frame || {};
  const h = +frame.baseH || 0;
  const kind = frame.taskMap === 'noSwap' ? 'noSwap' : 'swap';
  const phi = TASKMAP_PHI[kind] * D2R;
  const c = Math.cos(phi), s = Math.sin(phi);

  /* base = Rz(φ)·(OXYZ − [0,0,baseH]) ；反变换 Rz(−φ) 再抬回去 */
  const fwd = v => [c * v[0] - s * v[1], s * v[0] + c * v[1], v[2]];
  const inv = v => [c * v[0] + s * v[1], -s * v[0] + c * v[1], v[2]];

  return {
    yaw: +frame.yaw || 0, baseH: h, taskMap: kind, phiDeg: TASKMAP_PHI[kind],
    /* off：装配臂在 OXYZ 下的【水平位置】({x,y})，可省略。
       ★ 为什么高度不从这里来：高度一直是 baseH（frame 的一部分，=170），
         这条约定从最早就是这样，改了会让所有历史结论变数。
         所以这里只承担"多臂左右分开装"带来的水平偏移；
         不传 off 时行为与以前【逐字相同】（只减 baseH）。
       ★ 多臂必须按臂传 off —— 两条臂装的位置不同，
         同一个任务点在各自 base 系里的坐标就不同。 */
    toBase: (p, off) => {
      const q = fwd([p[0] - (+(off && off.x) || 0),
                     p[1] - (+(off && off.y) || 0),
                     p[2] - h]);
      return [q[0], q[1], q[2]];
    },
    toTask: (p, off) => {
      const q = inv(p);
      return [q[0] + (+(off && off.x) || 0),
              q[1] + (+(off && off.y) || 0),
              q[2] + h];
    },
    dirToBase: d => fwd(d),
    dirToTask: d => inv(d),
    describe: () => kind + ' (Rz(' + TASKMAP_PHI[kind] + '°), 抬高 ' + h + 'mm)'
  };
}

/* 重新按当前 frame 造一个 taskMap 对象（改映射后调，不重新 apply 整个配置） */
function rebuildTaskMap() {
  if (!CONFIG || !CONFIG.rules) return null;
  MAP = mapObj(CONFIG.rules.frame);
  return MAP;
}

/* ---------------- 应用一个配置 ---------------- */
function applyConfig(id) {
  const cfg = CONFIGS[id];
  if (!cfg) throw new Error('没有这个配置：' + id);
  CONFIG = cfg;
  APPLIED_CONFIG_ID = id;

  /* 1) 臂型 → MODEL（引擎只从这里拿模型，不再自带示例臂）
       支持单臂 model 与多臂 arms 两种写法，统一归一化。 */
  const armList = normalizeArms(cfg);
  cfg.__arms = armList;                       // 引擎的 buildChain 读它
  if (armList.length) {
    MODEL = armList[0];                       // 第 0 条臂 = MODEL（老语义）
  }
  if (MODEL) buildChain();

  /* 2) 竞赛规则 */
  if (cfg.rules) {
    RULES = JSON.parse(JSON.stringify(cfg.rules));
    if (RULES.frame) {
      RULES.baseH = RULES.frame.baseH;
      MAP = mapObj(RULES.frame);
    } else {
      MAP = null;
    }
  } else {
    RULES = null;          // 没有规则：任务域那块界面自己会隐藏/提示
    MAP = null;
  }

  /* 3) 车体 / 尺寸规则。没配就回到"空"（尺寸校核那块会自己让开） */
  if (cfg.chassis) {
    const c = cfg.chassis;
    CHASSIS   = JSON.parse(JSON.stringify(c.chassis || {}));
    SIZER     = JSON.parse(JSON.stringify(c.sizer || {}));
    CHASSIS_V = (c.v === undefined ? CHASSIS_V : c.v);
  } else {
    CHASSIS = { posMode:'base', pos:[0,0,0], size:[1,1,1], zDir:-1 };
    SIZER   = { lwh:[0,0,0], ballD:0, ballH:0 };
  }

  /* 4) 按配置刷新能刷的界面（引擎不认识的控件就不动） */
  syncConfigUI();
  if (typeof renderAngles === 'function') renderAngles();
  if (typeof renderVehicle === 'function') renderVehicle();
  return cfg;
}

/* 配置切换后把界面同步一下。找不到的控件直接跳过 —— 配置可以不带规则/车体。 */
function syncConfigUI() {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
  const txt = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };

  if (MODEL) txt('model', MODEL.name + '（' + MODEL.links.length + ' 段，' +
                         '安装 yaw ' + (MODEL.base && MODEL.base.yaw) + '°）');
  set('selMap', (MAP && MAP.taskMap === 'noSwap') ? 'side' : 'swap');

  const sel = document.getElementById('selConfig');
  if (sel) {
    sel.innerHTML = listConfigs()
      .map(cid => '<option value="' + cid + '"' + (cid === activeConfigId() ? ' selected' : '') +
                  '>' + (CONFIGS[cid].label || cid) + '</option>').join('');
  }
  /* 没有竞赛规则时，把依赖规则的面板标出来 */
  const noRule = document.getElementById('noRuleWarn');
  if (noRule) noRule.style.display = (RULES && RULES.levels) ? 'none' : '';
}

/* 把可选配置列表填进下拉框（DOM 就绪后调） */
function initConfigSelector() {
  const sel = document.getElementById('selConfig');
  if (!sel) return;
  sel.innerHTML = listConfigs()
    .map(cid => '<option value="' + cid + '"' + (cid === activeConfigId() ? ' selected' : '') +
                '>' + (CONFIGS[cid].label || cid) + '</option>').join('');
  sel.onchange = () => {
    if (!confirm('切换到「' + CONFIGS[sel.value].label + '」？当前模型会被替换')) {
      sel.value = activeConfigId(); return;
    }
    /* ★ 先给【切走的那条构型】落盘，再开始切换。
       存档按 configId 分键，切之前不存就等于丢掉刚才那条臂上的改动。 */
    if (typeof saveLocal === 'function') saveLocal();
    /* ★ 切换途中禁止落盘：这段里模型/角度还没对上，
       任何一次写到"新构型那条键"上都会把它写坏（踩过：切回来角度全零）。 */
    if (typeof holdSave === 'function') holdSave(true);
    try {
      applyConfig(sel.value);
      /* ★ 再把【切过来的这条构型】自己那份接上：上次在它上面改过的杆长/限位
         应该还在（各存各的、互不覆盖）。顺序与启动时一致 ——
         先设置、再模型、最后才恢复关节角（setModel 会清空 Q）。 */
      if (typeof loadCfg === 'function') loadCfg();
      const mine = (typeof loadLocal === 'function') ? loadLocal() : null;
      const fits = (typeof modelFitsConfig === 'function') ? modelFitsConfig(mine) : !!mine;
      if (mine && fits && typeof setModel === 'function') {
        setModel(mine);                     // 内部会 updateAll + 重画面板（落盘被压住）
        if (typeof loadCfg === 'function') loadCfg({ qOnly: true });   // 模型定了，再恢复关节角
      } else {
        updateAll();
      }
      /* 链结构变了（关节数/限位/杆长），"旋转角度"面板要跟着重画 */
      if (typeof refreshAnglesUI === 'function') refreshAnglesUI();
      if (typeof syncCfgInputs === 'function') syncCfgInputs();
    } finally {
      if (typeof holdSave === 'function') holdSave(false);
    }
    if (typeof saveLocal === 'function') saveLocal();   // 状态齐了，这时才写
  };
}

/* 取某个配置里的臂型（深拷贝）。
   注意与 demoModel() 的区别：
     configModel('tongji')  → 配置里【原始】的同济臂，永远不变
     demoModel()            → 【当前】模型（点"示例"按钮时用来把当前模型重置回配置）
   要拿"那条示例臂本身"（导出、对表、回归）一律用这个。 */
function configModel(id) {
  const cfg = CONFIGS[id || DEFAULT_CONFIG_ID];
  if (!cfg || !cfg.model) return null;
  return JSON.parse(JSON.stringify(cfg.model));
}

/* ---------------- 多臂归一化 ----------------
   配置里两种写法都收，内部统一成"一个臂数组"：

     单臂（老写法，推荐继续用）：
         model: { name, base:{xyz,yaw}, links:[...] }

     多臂：
         arms: [ {name, base:{xyz,yaw}, links:[...]}, {...} ]
         （写了 arms 就不用写 model；两个都写时以 arms 为准）

   归一化之后：
     · ARMS[a]  = 第 a 条臂的模型（含 name/base/links）
     · MODEL    = ARMS[0] 的别名 ⇒ 所有老代码/老自检照旧
     · 各臂的 base.yaw 若没写，回落到 rules.frame.yaw（与单臂一致的行为）

   为什么要支持多臂：双臂机器人两条臂的安装位置与朝向都不同，
   但关节角是同一时刻的一组向量，"协同"就是同一组 q 下两条臂同时到某处。 */
function normalizeArms(cfg) {
  let list = [];
  if (Array.isArray(cfg.arms) && cfg.arms.length) {
    list = cfg.arms.map(a => JSON.parse(JSON.stringify(a)));
  } else if (cfg.model) {
    list = [JSON.parse(JSON.stringify(cfg.model))];
  }
  const fy = (cfg.rules && cfg.rules.frame && typeof cfg.rules.frame.yaw === 'number')
    ? cfg.rules.frame.yaw : 0;
  list.forEach((m, i) => {
    if (!m.base) m.base = { xyz: [0, 0, 0], yaw: fy };
    if (!Array.isArray(m.base.xyz)) m.base.xyz = [0, 0, 0];
    /* 只有【单臂】才把安装朝向统一成 frame.yaw（老行为，不能变）；
       多臂时每条臂的 yaw 是自己的，帧里的 yaw 只描述"任务系怎么摆"。 */
    if (list.length === 1 && typeof cfg.rules !== 'undefined' && cfg.rules &&
        cfg.rules.frame && typeof cfg.rules.frame.yaw === 'number') {
      m.base.yaw = cfg.rules.frame.yaw;
    }
    if (!m.name) m.name = '臂' + i;
    if (!Array.isArray(m.links)) m.links = [];
  });
  return list;
}

/* 当前生效的所有臂（引擎的 buildChain 会调它） */
function activeArms() {
  return (CONFIG && CONFIG.__arms) ? CONFIG.__arms : null;
}

/* ---------------- 每条臂自己的装配位 ----------------
   多臂时两条臂装在车上的位置不同（一左一右），所以"它相对世界坐标系原点在哪"
   是【每条臂各一份】。任务域校核按臂分别做 —— 这是"单臂三轴检验 × 2"的前提：
   否则两条臂共用一个装配位，基座重合、可达集完全相同，
   "分别校核两次"就退化成把同一个答案抄两遍。

   取值优先级：arm.asm → 模型级 vehicle.asm → RULES.init（单臂老配置兜底）。 */
function asmOfArm(a) {
  a = a || 0;
  const A = ARMS[a];
  if (A && A.model && A.model.asm) {
    const s = A.model.asm;
    return { x: +s.x || 0, y: +s.y || 0, z: +s.z || 0 };
  }
  if (MODEL && MODEL.vehicle && MODEL.vehicle.asm) {
    const s = MODEL.vehicle.asm;
    return { x: +s.x || 0, y: +s.y || 0, z: +s.z || 0 };
  }
  const ini = (RULES && RULES.init) ? RULES.init : { x: 0, y: 0, z: 0 };
  return { x: +ini.x || 0, y: +ini.y || 0, z: +ini.z || 0 };
}
function asmAllArms() {
  const n = (typeof armCount === 'function') ? armCount() : 1;
  const out = [];
  for (let a = 0; a < n; a++) out.push(asmOfArm(a));
  return out;
}

/* ---------------- 启动时把默认配置装上 ----------------
   由 05-bootstrap.js 在所有模块与配置文件都加载完之后调用。
   ★ 必须放在最后：applyConfig 会用到 MODEL/RULES/MAP/CHASSIS/SIZER，
     而它们的声明在前面几个模块里（同一个 <script> 作用域，TDZ）。 */
function initDefaultConfig() {
  const ids = listConfigs();
  if (!ids.length) throw new Error('没有任何配置：web/src/configs/ 是不是空了？');
  const id = ids.includes(DEFAULT_CONFIG_ID) ? DEFAULT_CONFIG_ID : ids[0];
  applyConfig(id);
  return id;
}

                'noSwap'  : base.X = -OXYZ.Y, base.Y = +OXYZ.X  （绕 Z +90°）

     ★ 这三件事以前是【手写死】在 02 模块里的，而 MATLAB 的 t7 又自己写了一
       另一套，结果两边差 90°，t7 报出假的"0/200 可解"。
       现在引擎从这三个字段算出换算，MATLAB 侧照抄同一公式即可。
       见 docs/notes/base_yaw决策待定.md

     ⚠ 注意 yaw 与 taskMap 是【两个独立的东西】，别以为改一个另一个会跟着变：
       当前 yaw=-90 而 taskMap='swap'（等效绕 Z 180°），两者并不相等。
       这不是笔误 —— 是历史上就这么定的，保持原样以免改动已有结论。 */
  rules: {
    src: '规则手册 表5-10（x,y,z 单位 mm，角度 °）',
    frame: { yaw: -90, baseH: 170, taskMap: 'swap' },
    init: { x: -500, y: -200, z: 800, th: 0, ph: 90, al: 0 },   // 装配臂位置（OXYZ 下）
    levels: {
      1: { name: '一级', x: [-100, 0], y: [100, 300], z: [500, 700], th: [0, 0],    ph: [90, 90], al: [0, 0],
           note: '无平移、无旋转要求' },
      2: { name: '二级', x: [-100, 0], y: [100, 300], z: [500, 700], th: [-90, 90], ph: [0, 90],  al: [-45, 45],
           note: '放入后沿 z 平移 100mm，无旋转要求' },
      3: { name: '三级', x: [-100, 0], y: [100, 300], z: [500, 700], th: [-90, 90], ph: [0, 90],  al: [-45, 45],
           note: '放入后沿 z 平移 100mm；再以 P 轴为旋转轴旋转' }
    },
    /* 装配动作约定（与示例一致；缺了这几项判据会走内置默认值，
       所以显式写出来，免得"看着有配置、其实是默认"） */
    act: {
      gripAxis: 'x',
      insertAxis: 'y',
      lift: 100,
      rotRange: [0, 90],
      rotStep: 15,
      steps: [
        { axis: 'p', ang: 90 },      // 绕 P 轴 +90°：单元竖到与 Z 轴平行
        { axis: 'q', ang: 90 }       // 绕插入轴 ±90°：多姿态
      ],
      insToolAxis: 'x',
      Qaxis: 'X′ ( = e⃗ )',
      Paxis: 'Y′',
      eeZalign: '-e⃗'
    }
  },

  /* ---------------- 车体 / 伸展尺寸规则 ----------------
     ★ 底盘位置与示例不同：示例是 [0,140,0]（底盘在 base 系里往前偏 140），
       这条按用户 2026-10-12 从界面上调的值改为 [0,0,0]（底盘中心就在原点下方）。
       尺寸本身（580×580×105）还是占位值，真机尺寸确定后一起改。
     CHASSIS_V 改动默认值时 +1，否则老存档会把新默认值盖回去 */
  chassis: {
    v: 3,
    chassis: { posMode: 'base', pos: [0, 0, 0], size: [580, 580, 105], zDir: -1 },
    sizer:   { lwh: [1200, 1200, 1100], ballD: 1500, ballH: 480 }
  }
});

/* ==================================================================
   05-bootstrap.js —— 收尾：把默认配置装上

   ★ 必须排在【所有模块与配置文件之后】执行。
     原因：applyConfig() 要写 MODEL / RULES / MAP / CHASSIS / SIZER，
     这些变量的 let 声明在 01 / 02 / 03 里。它们在同一个 <script> 作用域中，

   ==================================================================================== */

initDefaultConfig();
