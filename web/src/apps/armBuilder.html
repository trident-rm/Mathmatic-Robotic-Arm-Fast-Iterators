<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>机械臂可行性集 · 建模器</title>
<style>
  :root{ --bg:#0f1420; --panel:#161d2d; --line:#26314a; --fg:#e6ecf7; --dim:#8fa0bf;
         --box:#5a6580; --cres:#3ea6ff; --warn:#ffb454; --ok:#4ade80; --axis:#e879f9;
         --red:#ff5f5f; --grn:#5fff8f; --blu:#5f9fff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  #hdr{padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);
       display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  #title{font-size:14px;font-weight:600}
  #model{color:var(--dim);font-size:11px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:#0b1020;border:1px solid var(--line);border-radius:999px;
        padding:3px 10px;font-size:11px;color:var(--dim);white-space:nowrap}
  .chip b{color:var(--fg)}
  #tools{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:11px;color:var(--dim);flex-wrap:wrap}
  button{background:#0b1020;color:var(--fg);border:1px solid var(--line);border-radius:6px;
    padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
  button:hover{border-color:#3d4c6e}
  button.primary{border-color:#2f6fb0;color:#9fd4ff}
  button.danger:hover{border-color:#a04040;color:#ff9a9a}
  #views{flex:1;display:flex;min-height:0}
  .cell{position:relative;min-width:0}
  #left{flex:1;border-right:1px solid var(--line)}
  #right{width:392px;background:var(--panel);display:flex;flex-direction:column}
  #list{flex:1 1 42%;overflow-y:auto;padding:8px 10px;min-height:90px}
  #dataBody{flex:1;overflow-y:auto;padding:4px 12px 10px;font-size:11.5px;line-height:1.7;color:var(--dim)}

  /* ---- 可折叠分区（模型链 / 旋转角度 / 可达域）---- */
  .sect-hd{display:flex;align-items:center;gap:7px;padding:7px 12px;cursor:pointer;
    background:#0e1524;border-bottom:1px solid var(--line);border-top:1px solid var(--line);
    font-size:11.5px;font-weight:600;color:#9fd4ff;user-select:none;flex:0 0 auto}
  .sect-hd:hover{background:#131c30}
  .sect-hd .caret{color:#5d6b88;font-size:10px;transition:transform .12s}
  .sect-hd.collapsed .caret{transform:rotate(-90deg)}
  .sect-hd button{margin-left:auto}
  .sect-bd{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .sect-bd.hidden{display:none}
  #bdList{flex:1 1 40%;min-height:90px}
  #bdQ{flex:0 0 auto;max-height:190px;overflow-y:auto}
  #bdData{flex:1 1 40%;min-height:120px;background:#111827}

  /* ---- 顶栏的勾选下拉 ---- */
  .pop{position:absolute;display:none;z-index:40;background:#0b1020;border:1px solid var(--line);
    border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:7px 10px;min-width:132px}
  .pop.on{display:block}
  .pop label{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11.5px;
    color:var(--fg);cursor:pointer;white-space:nowrap}
  button.ghost{background:transparent;border-color:#2c3a58}

  /* ---- 旋转角度表 ---- */
  #qbody{padding:6px 12px 8px}
  #qbody table{width:100%;border-collapse:collapse;font-size:11.5px}
  #qbody td{border-bottom:1px solid #1e2740;padding:2px 4px}
  #qbody td.nm{color:var(--dim)}
  #qbody td.v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
  #qbody tr.hot td.v{color:#ffe066}
  #qbody .axc{color:#8fa0bf}

  /* ---- 新建向导 ---- */
  #wiz{position:fixed;inset:0;background:rgba(6,9,17,.72);display:none;
    align-items:center;justify-content:center;z-index:60}
  #wiz.on{display:flex}
  .wcard{width:560px;max-height:86vh;display:flex;flex-direction:column}
  .wstep{display:flex;gap:6px;padding:0 0 12px;flex-wrap:wrap}
  .wstep span{font-size:10.5px;color:#5d6b88;border:1px solid var(--line);border-radius:999px;
    padding:2px 9px;white-space:nowrap}
  .wstep span.on{color:#0b1020;background:#9fd4ff;border-color:#9fd4ff;font-weight:600}
  .wstep span.done{color:var(--ok);border-color:#2c5a3a}
  .wbody{flex:1;overflow-y:auto;min-height:190px;padding-right:2px}
  .wbody h3{margin:0 0 4px;font-size:13px}
  .wbody .sub{color:var(--dim);font-size:11px;margin:0 0 10px}
  .wbody .two{display:flex;gap:10px}
  .wbody .pick{flex:1;border:1px solid var(--line);border-radius:9px;padding:12px;
    background:#121a29;cursor:pointer;text-align:center}
  .wbody .pick:hover{border-color:#3d4c6e}
  .wbody .pick.on{border-color:#9fd4ff;background:#16243c}
  .wbody .pick b{display:block;font-size:13px;margin-bottom:4px}
  .wbody .pick span{font-size:11px;color:var(--dim)}
  .wfoot{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--line);margin-top:10px}
  .wspacer{flex:1}
  .segrow{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px;background:#121a29}
  .segrow .t{font-size:11.5px;font-weight:600;margin-bottom:6px;color:#9fd4ff}
  .segrow .f{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:5px 7px;align-items:center}
  .segrow .f label{font-size:11px;color:var(--dim)}
  .segrow input,.segrow select{width:100%}
  .del{margin-left:auto;color:#ff8a8a;background:transparent;border-color:#4a2530;padding:1px 7px}

  #dataBody b{color:var(--fg)}
  #dataBody table{width:100%;border-collapse:collapse;margin:2px 0 4px}
  #dataBody td,#dataBody th{border-bottom:1px solid #1e2740;padding:2px 4px;text-align:left;font-weight:400}
  #dataBody th{color:#7d8cab;font-size:10.5px}
  #dataBody .num{text-align:right;font-variant-numeric:tabular-nums}
  #dataBody .good{color:var(--ok)} #dataBody .bad{color:var(--warn)}
  #dataBody .sect{margin:11px 0 5px;font-size:11px;font-weight:600;color:#9fd4ff;
    border-bottom:1px solid #223052;padding-bottom:3px;letter-spacing:.02em}
  #dataBody .grid{display:grid;grid-template-columns:1fr auto;gap:1px 10px}
  #dataBody .grid span{color:var(--dim)} #dataBody .grid b{text-align:right;
    font-variant-numeric:tabular-nums;font-weight:600}
  #dataBody .one{color:var(--dim)}
  #animMsg{color:#ffe066}
  .cap{position:absolute;left:12px;top:10px;font-size:11px;color:var(--dim);
       background:rgba(11,16,32,.72);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
  .hint{position:absolute;right:12px;bottom:10px;font-size:10px;color:#5d6b88}
  #chain{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--dim);
         background:rgba(11,16,32,.8);border:1px solid var(--line);border-radius:6px;
         padding:6px 9px;max-width:88%;line-height:1.7}
  #chain b{color:var(--fg)} #chain .fx{color:#8fa0bf}
  canvas{display:block;width:100%;height:100%}
  #legend{display:flex;gap:14px;padding:6px 14px;border-top:1px solid var(--line);
          background:var(--panel);font-size:11px;color:var(--dim);flex-wrap:wrap}
  .k{display:inline-flex;align-items:center;gap:5px}
  .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
  /* ---- 右侧编辑面板 ---- */
  #right .head{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:8px;justify-content:space-between}
  #list{flex:1;overflow-y:auto;padding:8px 10px}
  .row{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);
    border-radius:7px;margin-bottom:6px;background:#121a29}
  .row .idx{color:#5d6b88;font-variant-numeric:tabular-nums;min-width:16px}
  .row .nm{flex:1;min-width:0}
  .row .nm b{display:block;font-weight:600;font-size:12px}
  .row .nm span{color:var(--dim);font-size:10.5px}
  .row button{padding:2px 7px;font-size:10.5px}
  #form,#cform{border-top:1px solid var(--line);padding:10px 12px;background:#111827;
        max-height:66%;overflow-y:auto;display:none}
  #form.on,#cform.on{display:block}
  #cform{border-top-color:#4a4322}
  #cform .fld > label{min-width:74px}
  #cform input[type=number]{width:60px}
  #cform select{max-width:250px}
  /* ---- 上下分隔条：拖动改变「模型链 / 可达域」的高度 ---- */
  #split{flex:0 0 9px;cursor:ns-resize;background:#0b1020;position:relative;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);z-index:3}
  #split:hover,#split.on{background:#22304e}
  #split::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:48px;height:3px;border-radius:2px;background:#3d4c6e;pointer-events:none}
  #split:hover::after,#split.on::after{background:#9fd4ff}
  .sub{color:#5d6b88;font-size:10.5px;margin:-3px 0 7px}
  .fld{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap}
  .fld > label{color:var(--dim);min-width:66px;font-size:11.5px}
  input[type=text],input[type=number],select{background:#0b1020;color:var(--fg);
    border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:11.5px;font-family:inherit}
  input[type=number]{width:74px}
  input[type=text]{width:104px}
  .rad{display:inline-flex;align-items:center;gap:4px;color:var(--fg);font-size:11.5px;cursor:pointer}
  .note{color:#5d6b88;font-size:10.5px}
  .okmsg{color:var(--ok)} .badmsg{color:var(--red)}
  /* ---- 弹窗 ---- */
  #modal{position:fixed;inset:0;background:rgba(6,9,16,.88);z-index:50;
    display:flex;align-items:center;justify-content:center}
  #modal.hidden{display:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:26px 30px;max-width:460px;text-align:center}
  .card h2{margin:0 0 6px;font-size:17px}
  .card p{color:var(--dim);font-size:12px;margin:0 0 18px;line-height:1.7}
  .card .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .card button{padding:10px 18px;font-size:13px;border-radius:9px}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div><div id="title">机械臂可行性集 · 建模器</div><div id="model"></div></div>
    <div class="chips" id="chips"></div>
    <div id="tools">
      <label class="k" title="构型 = 臂型 + 规则 + 车体尺寸；在 web/src/configs/ 里加文件即可扩充">配置
        <select id="selConfig"></select>
      </label>
      <label class="k" title="装配臂在任务坐标系(OXYZ)下的位置；影响任务域校核与插入姿态">装配臂位置
        <input type="number" id="inCx" step="10" value="-200" style="width:64px">
        <input type="number" id="inCy" step="10" value="-200" style="width:64px">
        <input type="number" id="inCz" step="10" value="800"  style="width:64px">
      </label>
      <label class="k" title="臂本体装在车上的朝向（绕竖直轴）；决定整车系与臂基座系的夹角">安装yaw
        <input type="number" id="inYaw" step="15" value="-90" style="width:62px">
      </label>
      <label class="k" title="任务坐标系三轴与整车系的对应关系">映射
        <select id="selMap">
          <option value="swap">核心在前</option>
          <option value="side">核心在侧</option>
        </select>
      </label>
      <button id="btnVis" title="显示哪些参考框：坐标架 / 底盘框 / 长宽高框 / 限制球">👁 显示</button>
      <div class="pop" id="visMenu">
        <label><input type="checkbox" id="cbFrames" checked> 坐标架</label>
        <label><input type="checkbox" id="cbChassis" checked> 底盘框</label>
        <label><input type="checkbox" id="cbLWH" checked> 长宽高框</label>
        <label><input type="checkbox" id="cbBall" checked> 限制球</label>
      </div>
      <label class="k" title="随机采样点数：越多可达集越准，越慢">采样
        <select id="selN">
          <option value="10000">1万</option>
          <option value="30000" selected>3万</option>
          <option value="100000">10万</option>
        </select>
      </label>
      <button id="btnChassis" title="底盘碰撞箱与伸展尺寸的限值">▦ 底盘 / 尺寸</button>
      <button id="btnSave" title="把当前模型存成 .json">保存 JSON</button>
      <button id="btnLoad" title="读取之前存的 .json 模型">读取文件</button>
      <button id="btnDemo" title="载入当前配置里的示例臂型">示例</button>
      <button id="btnNew" title="从零搭一条新臂">新建</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
    </div>
  </div>
  <div id="views">
    <div class="cell" id="left">
      <canvas id="c3d"></canvas>
      <div id="chain" title="链结构：整机原点 O → 各 body 与关节"></div>
      <div class="hint" id="camhint"></div>
    </div>
    <div class="cell" id="right">
      <!-- ① 模型链 -->
      <div class="sect-hd" id="hdList" title="点标题可折叠">
        <span class="caret">▾</span><span>模型链（点击编辑）</span>
        <button id="btnAdd" class="primary">＋ 建立坐标系</button>
      </div>
      <div class="sect-bd" id="bdList">
        <div id="list"></div>
        <div id="cform"></div>
        <div id="form"></div>
      </div>

      <div id="split" title="上下拖动 = 调两栏高度 · 双击复原"></div>

      <!-- ② 旋转角度 -->
      <div class="sect-hd" id="hdQ" title="点标题可折叠">
        <span class="caret">▾</span><span>旋转角度</span>
        <button id="btnQPanel" class="ghost" title="展开滑条，拖动手动调各关节角">🎛 关节</button>
      </div>
      <div class="sect-bd" id="bdQ">
        <div id="qbody"></div>
      </div>

      <div id="split2" title="上下拖动 = 调两栏高度 · 双击复原"></div>

      <!-- ③ 可达域 / 任务域 -->
      <div class="sect-hd" id="hdData" title="点标题可折叠">
        <span class="caret">▾</span><span>可达域 / 任务域数据</span>
        <button id="btnAnim" class="primary" title="播放插入装配演示">▶ 示例装配动画</button>
      </div>
      <div class="sect-bd" id="bdData">
        <div id="animMsg"></div>
        <div id="dataBody">载入模型后显示…</div>
      </div>
    </div>
  </div>
  <div id="legend">
    <span class="k"><i class="sw" style="background:var(--red)"></i>X</span>
    <span class="k"><i class="sw" style="background:var(--grn)"></i>Y</span>
    <span class="k"><i class="sw" style="background:var(--blu)"></i>Z</span>
    <span class="k"><i class="sw" style="background:#e8933a"></i>杆（相邻坐标系间距）</span>
    <span class="k"><i class="sw" style="background:var(--axis)"></i>关节轴</span>
    <span class="k"><i class="sw" style="background:#ffe066"></i>当前关节</span>
    <span class="k"><i class="sw" style="background:var(--cres)"></i>可达点云</span>
    <span class="k"><i class="sw" style="background:#ffd400"></i>底盘碰撞箱</span>
    <span class="k"><i class="sw" style="background:#00e5c0"></i>长宽高框 1200×1200×1100</span>
    <span class="k"><i class="sw" style="background:#a78bfa"></i>限制球 ⌀1500（球心距接地中心 480）</span>
    <span class="k" id="lgJoints"></span>
  </div>
</div>

<div id="modal">
  <div class="card">
    <h2>机械臂可行性集</h2>
    <p>只给「杆 + 关节 + 坐标系 + 角度限位」，算出带限位的可达集。全部在本页面内计算。</p>
    <div class="btns">
      <button id="mNew" class="primary">新建</button>
      <button id="mDemo">示例</button>
      <button id="mLast">上次</button>
      <button id="mLoad">读取文件</button>
    </div>
  </div>
</div>

<!-- ===== 新建向导：单臂/双臂 → base_yaw → 逐段搭 joint+link → 装配位置 → 夹爪插入轴 ===== -->
<div id="wiz">
  <div class="card wcard">
    <div class="wstep" id="wSteps"></div>
    <div class="wbody" id="wBody"></div>
    <div class="wfoot">
      <button id="wCancel">取消</button>
      <span class="wspacer"></span>
      <button id="wPrev">上一步</button>
      <button id="wNext" class="primary">下一步</button>
    </div>
  </div>
</div>
